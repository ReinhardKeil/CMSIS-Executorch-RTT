project:
  packs:
    - pack: PyTorch::ExecuTorch@1.5.1
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-RTX@^5.9.0
    - pack: ARM::SDS@3.1.0

  connections:
    - connect: Pose estimation with SDS image playback
      provides:
        - CMSIS-RTOS2
      consumes:
        - SDS
        - CMSIS_VIO
        - STDOUT
        - STDERR
        - Heap: +65536

  define:
    - OS_IDLE_THREAD_NAME: \"Idle\"
    - OS_TIMER_THREAD_NAME: \"Timer\"

  misc:
    - CPP:
        - -std=gnu++17
        - -Wno-deprecated-declarations
    - for-compiler: AC6
      CPP:
        - -Wno-nan-infinity-disabled

  groups:
    - group: Pose Application
      files:
        - file: ./src/pose_app.cpp
        - file: ./src/arm_embedded_module.cpp
        - file: ./src/arm_embedded_module.hpp

  components:
    - component: CMSIS:OS Tick:SysTick
    - component: CMSIS:RTOS2:Keil RTX5&Source

  layers:
    - layer: $SDSIO-Layer$
      type: SDSIO
    - layer: $Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI

  output:
    type:
      - elf
      - hex
      - map
