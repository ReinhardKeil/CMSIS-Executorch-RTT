solution:
  created-for: CMSIS-Toolbox@2.15.0
  cdefault:
  compiler: AC6

  packs:
    - pack: PyTorch::ExecuTorch@1.5.1
    - pack: AlifSemiconductor::Ensemble@2.2.1
    - pack: ARM::CMSIS@^6.2.0
    - pack: ARM::CMSIS-Compiler@^2.1.0
    - pack: ARM::CMSIS-RTX@^5.9.0
    - pack: ARM::SDS@3.1.0
    - pack: SEGGER::RTT@^8.58.0

  target-types:
    - type: DevKit-E7-HP
      board: DevKit-E7
      device: AE722F80F55D5LS:M55_HP
      variables:
        - Board-Layer: $SolutionDir()$/board/DevKit-E7/M55_HP/Board_HP.clayer.yml
          copied-from: ${CMSIS_PACK_ROOT}/AlifSemiconductor/Ensemble/2.2.1/Boards/DevKit-e7/Layers/M55_HP/
        - SDSIO-Layer: $SolutionDir()$/sdsio/rtt/sdsio_rtt.clayer.yml
          copied-from: ${CMSIS_PACK_ROOT}/ARM/SDS/3.1.0/layer/sdsio/rtt/
        - AI-Layer: $SolutionDir()$/ai_layer_pose/ai_layer.clayer.yml
      target-set:
        - set:
          images:
            - project-context: pose-estimation.Debug
          debugger:
            name: ULINKplus@pyOCD

  build-types:
    - type: Debug
      debug: on
      optimize: debug

  projects:
    - project: ./pose-estimation.cproject.yml

  mlops:
    description: Synthetic 17-keypoint pose estimator for Ethos-U55-256
    npu:
      type: Ethos-U55
      macs: 256
    vela:
      system: RTSS_HP_SRAM_MRAM
      memory: Shared_Sram
    model:
      clayer: $AI-Layer$
      name: TinyPoseNet
      module: pose_model
      input-shape: 1x64x64x3
      calibration-samples: 8
